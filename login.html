<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100" 
      style="background: url('{{ url_for('static', filename='image/login_bg.jpg') }}') no-repeat center center; background-size: cover;">
    <div class="card p-4 shadow" style="width: 350px; background-color: rgba(255,255,255,0.9);">
        <h3 class="mb-3 text-center">Admin Login</h3>
        <form method="POST">
            <input type="text" class="form-control mb-2" name="username" placeholder="Username" required>
            <input type="password" class="form-control mb-3" name="password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <div class="text-end mt-2">
                <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
            </div>
        </form>
        <p class="mt-3 text-center">No account? <a href="{{ url_for('signup') }}">Signup</a></p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} mt-2">{{ message }}</div>
          {% endfor %}
        {% endwith %}
    </div>
</body>
</html>
